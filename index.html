<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gửi cúnnn ❤️</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="sparkles" aria-hidden="true"></div>

            <h1 id="title">
                Huyên đồng ý làm người yêu toii nhé❤️
            </h1>

            <div class="gif-wrapper">
                <img
                    id="gif"
                    class="bear-gif"
                    src="images/Huyen.png"
                    alt="Siêu đáng yêu"
                >
            </div>

            <p id="message" aria-live="polite">
                toii có một điều muốn nói với cún... 🥰
            </p>

            <div class="button-container">

                <button id="yesBtn" class="btn yes-btn" type="button">
                    Đồng ý ❤️
                </button>

                <button id="noBtn" class="btn no-btn" type="button">
                    Không 🥺
                </button>

            </div>

        </div>

    </main>

<div id="hearts-container" aria-hidden="true"></div>

<audio id="loveMusic" loop>
    <source src="music/baihat.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" class="music-btn" type="button">
    🎵 Nhạc đang phát
</button>

<script src="scripts.js"></script>

</body>
</html>
